# Builds Ozmix Studyo for every platform with Tauri 2.
#   Desktop: macOS (universal .dmg), Windows (.msi + setup .exe), Linux (.AppImage + .deb)
#   Android: tablets & phones (.apk for sideloading, .aab for Google Play)
#   iOS / iPadOS: .ipa (needs an Apple Developer account, see PACKAGING.md)
# Run it from the Actions tab ("Run workflow") or push a tag like v0.9.0 to also create a draft release.
name: Build apps

on:
  workflow_dispatch:
    inputs:
      native_plugins:
        description: 'Desktop: include VST3 hosting (experimental "native-plugins" feature)'
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            rust_targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.rust_targets }}' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - name: LLVM/libclang (VST3 hosting build)
        if: inputs.native_plugins && matrix.name == 'Windows'
        run: choco install llvm -y
      - name: Linux system libraries
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad libclang-dev libasound2-dev libxcb1-dev libxcb-util-dev
      - run: npm install
      # macOS signing + notarization only when the secrets exist (an empty variable makes the build try to sign and fail)
      - name: Apple signing secrets
        if: matrix.name == 'macOS'
        env:
          C: ${{ secrets.APPLE_CERTIFICATE }}
          CP: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SI: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AI: ${{ secrets.APPLE_ID }}
          AP: ${{ secrets.APPLE_PASSWORD }}
          AT: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$C" ]; then
            { echo "APPLE_CERTIFICATE=$C"; echo "APPLE_CERTIFICATE_PASSWORD=$CP"; echo "APPLE_SIGNING_IDENTITY=$SI"; } >> "$GITHUB_ENV"
            if [ -n "$AI" ]; then { echo "APPLE_ID=$AI"; echo "APPLE_PASSWORD=$AP"; echo "APPLE_TEAM_ID=$AT"; } >> "$GITHUB_ENV"; fi
          else
            echo "No signing certificate: building an unsigned app"
          fi
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} ${{ inputs.native_plugins && '--features native-plugins' || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Ozmix Studyo ${{ github.ref_name }}'
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: warn

  android:
    name: Android (tablets & phones)
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # to publish the APK on the `apk` branch
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # the runner image already has the Android SDK; add the NDK and build tools with its sdkmanager
      - name: Android SDK + NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          { echo "ANDROID_HOME=$SDK"; echo "ANDROID_SDK_ROOT=$SDK"; echo "NDK_HOME=$SDK/ndk/${NDK_VERSION}"; } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - run: npm install
      - name: Generate the Android project
        run: |
          npx tauri android init --ci
          node scripts/android-setup.mjs
          npx tauri icon app-icon.png
      - name: Build APK + AAB
        run: npx tauri android build --apk --aab --ci
      - name: Sign (when a keystore is configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash scripts/android-sign.sh
      # the latest APK also goes to the `apk` branch, so it can be fetched with plain git (no artifact download needed)
      - name: Publish APK to the apk branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/apkbr && cp out/android/*.apk /tmp/apkbr/
          cd /tmp/apkbr
          git init -q -b apk
          git add .
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            out/android/*.apk
            out/android/*.aab
          if-no-files-found: error

  ios:
    name: iOS / iPadOS
    # needs an Apple Developer account: set the repository variable IOS_ENABLED=true and the secrets listed in PACKAGING.md
    if: vars.IOS_ENABLED == 'true'
    runs-on: macos-latest
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - run: npm install
      - name: Generate the Xcode project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx tauri ios init --ci
          npx tauri icon app-icon.png --ios-color "#1e2027"
      - name: Build IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: npx tauri ios build --export-method app-store-connect --ci
      - name: Upload to TestFlight (optional)
        if: env.APP_STORE_KEY_ID != ''
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER }}
          API_KEY: ${{ secrets.APP_STORE_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app --type ios --file "$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
