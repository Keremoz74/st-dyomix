[package]
name = "ozmix-studyo"
version = "0.9.0"
description = "Ozmix Studyo: record, arrange and mix"
edition = "2021"
rust-version = "1.77.2"

[lib]
# the mobile apps (Android / iOS) load the app as a library
name = "ozmix_studyo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# VST3 hosting for native plug-ins (optional: `--features native-plugins`)
vst3-host = { version = "0.5", optional = true }

[features]
default = []
native-plugins = ["dep:vst3-host"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
